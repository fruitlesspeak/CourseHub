# Server
server.port=8080
server.forward-headers-strategy=framework

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://db:5432/appdb
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:5173,http://127.0.0.1:5173}

# Logging
logging.level.root=INFO
logging.level.com.example.backend=DEBUG

# HTTP Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=COURSEHUB_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
