name: Backend Mutation Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/mutation.yml"
  push:
    branches: [ main ]
    paths:
      - "backend/**"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

jobs:
  mutation-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Compile backend tests
        run: mvn -B -DskipTests test-compile

      - name: Run PIT mutation coverage
        run: >
          mvn -B org.pitest:pitest-maven:mutationCoverage
          -DtargetClasses=com.example.backend.service.RegisterService,com.example.backend.service.CourseService
          -DtargetTests=com.example.backend.register.*,com.example.backend.course.*

      - name: Upload mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-mutation-report
          path: backend/target/pit-reports/
          retention-days: 7
